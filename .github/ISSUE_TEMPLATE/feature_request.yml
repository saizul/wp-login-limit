name: Feature request
description: Suggest an improvement to the limits, IP handling, alerts, WP-CLI or developer hooks.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Login Limit stays small on purpose: no captcha services, no remote requests, no tracking.
        Features that fit are about correct limits, correct client IPs, admin workflow and integrations through hooks.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Could a setting, a filter or fail2ban do this instead?
  - type: checkboxes
    id: build
    attributes:
      label: Contribution
      options:
        - label: I would like to open a pull request for this.
