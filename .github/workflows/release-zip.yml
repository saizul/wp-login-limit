name: Release zip

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  SLUG: wp-login-limit

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: Check the version matches the tag
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          header=$(sed -n 's/^ \* Version: *//p' "$SLUG.php" | tr -d '[:space:]')
          define=$(sed -n "s/^define( 'WP_LOGIN_LIMIT_VERSION', '\(.*\)' );/\1/p" "$SLUG.php" | tr -d '[:space:]')
          constant=$(sed -n "s/^.*const VERSION *= '\(.*\)';/\1/p" src/Plugin.php | tr -d '[:space:]')
          stable=$(sed -n 's/^Stable tag: *//p' readme.txt | tr -d '[:space:]')
          echo "tag=$tag header=$header define=$define constant=$constant stable=$stable"
          test "$tag" = "$header"
          test "$tag" = "$define"
          test "$tag" = "$constant"
          test "$tag" = "$stable"

      - name: Build the plugin folder
        run: |
          mkdir -p "build/$SLUG"
          rsync -a --exclude-from=.distignore ./ "build/$SLUG/"
          # The plugin has no runtime Composer dependencies and no JavaScript build step.
          test ! -e "build/$SLUG/vendor"
          test ! -e "build/$SLUG/tests"
          test ! -e "build/$SLUG/bin"
          test ! -e "build/$SLUG/examples"
          test -e "build/$SLUG/$SLUG.php"
          test -e "build/$SLUG/uninstall.php"
          test -e "build/$SLUG/src/Plugin.php"
          test -e "build/$SLUG/src/Auth.php"
          test -e "build/$SLUG/src/IpResolver.php"
          test -e "build/$SLUG/src/Admin/SettingsPage.php"
          test -e "build/$SLUG/src/Store/DbAttemptStore.php"
          test -e "build/$SLUG/src/Cli/Command.php"
          test -e "build/$SLUG/languages/$SLUG.pot"
          test -e "build/$SLUG/readme.txt"
          test -e "build/$SLUG/LICENSE"
          find "build/$SLUG" -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
          find "build/$SLUG" -type f | sort

      - name: Smoke test the autoloader, IP resolution and lockout math
        run: |
          php -r '
            define("ABSPATH", __DIR__);
            spl_autoload_register(function ($c) {
              $prefix = "Saizul\\LoginLimit\\";
              if (strpos($c, $prefix) === 0) { require "build/wp-login-limit/src/" . str_replace("\\", "/", substr($c, strlen($prefix))) . ".php"; }
            });
            use Saizul\LoginLimit\{Fail2ban, Ip, IpResolver, Policy, Record};
            $resolver = new IpResolver(array("10.0.0.0/8"));
            $policy   = new Policy(900, 900, 4, 86400, 86400);
            $record   = new Record("ip", "203.0.113.5");
            $locked   = 0;
            for ($i = 0; $i < 5; $i++) { $locked = $policy->fail($record, 5, 1800000000); }
            $ok = "203.0.113.5" === $resolver->resolve(array("REMOTE_ADDR" => "10.0.0.2", "HTTP_X_FORWARDED_FOR" => "1.1.1.1, 203.0.113.5"))
              && "198.51.100.1" === $resolver->resolve(array("REMOTE_ADDR" => "198.51.100.1", "HTTP_X_FORWARDED_FOR" => "1.1.1.1"))
              && Ip::matches("2001:db8::1", array("2001:db8::/32"))
              && 900 === $locked && 3600 === $policy->duration(2) && 86400 === $policy->duration(9)
              && 0 === strpos(Fail2ban::line("lockout", "203.0.113.5", "admin", "login"), "wp-login-limit: lockout from 203.0.113.5");
            exit($ok ? 0 : 1);
          '

      - name: Create the zip
        run: |
          cd build
          zip -r -q "../$SLUG.zip" "$SLUG"
          cd ..
          unzip -l "$SLUG.zip" | tail -n 1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SLUG }}
          path: ${{ env.SLUG }}.zip

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "$SLUG.zip" --clobber
